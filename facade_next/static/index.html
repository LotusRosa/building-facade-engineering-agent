<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title data-zh="building-facade-engineering-agent" data-en="building-facade-engineering-agent">building-facade-engineering-agent</title><link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/history.css"></head>
<body><div class="app-shell"><aside id="workspaceSidebar" class="workspace-sidebar"><div class="workspace-brand"><span class="brand-mark" aria-hidden="true">F</span><strong>building-facade-engineering-agent</strong></div><button type="button" id="newChatProject" class="new-chat" data-zh="＋ 新聊天" data-en="＋ New chat"></button><div class="projects-label"><span data-zh="项目" data-en="Projects"></span><details id="newProjectDetails"><summary aria-label="New project" data-aria-zh="新建项目" data-aria-en="New project">＋</summary><form id="newProject"><label><span data-zh="项目名称" data-en="Project name"></span><input id="newProjectName" name="name" required placeholder="东楼巡检" data-placeholder-zh="东楼巡检" data-placeholder-en="East building inspection"></label><button data-zh="创建项目" data-en="Create project"></button></form></details></div><div id="projectList" class="project-list"></div><div class="sidebar-bottom"><button type="button" data-workspace-view="settings" data-zh="⚙ 设置" data-en="⚙ Settings"></button><small data-zh="本地工作空间 · 聊天推进任务" data-en="Local workspace · work through chat"></small></div><select id="project" hidden aria-label="Project" data-aria-zh="项目" data-aria-en="Project"></select></aside>
<main class="workspace-main"><header class="workspace-header"><button type="button" id="sidebarToggle" class="icon-button" aria-label="Toggle sidebar" data-aria-zh="切换侧栏" data-aria-en="Toggle sidebar">☰</button><div class="workspace-breadcrumb"><strong id="workspaceProject">building-facade-engineering-agent</strong><span>/</span><span id="workspaceTitle">新对话</span></div><span id="mode" class="badge"></span><label class="header-language"><span class="sr-only" data-zh="界面语言" data-en="Interface language"></span><select id="language" aria-label="Interface language" data-aria-zh="界面语言" data-aria-en="Interface language"><option value="zh">中文</option><option value="en">English</option></select></label><details id="modelConnection" class="llm-settings model-connection"><summary data-zh="连接模型" data-en="Connect model"></summary><div class="model-connection-body"><p id="llmStatus" role="status"></p><form id="llmForm" autocomplete="off"><label><span data-zh="服务商" data-en="Provider"></span><select id="llmProvider"><option value="off" data-zh="关闭" data-en="Off">关闭</option><option value="deepseek">DeepSeek</option><option value="openai">OpenAI</option><option value="compatible" data-zh="OpenAI 兼容" data-en="OpenAI compatible">OpenAI 兼容</option></select></label><label>API Base URL<input id="llmBase" type="url" placeholder="https://api.deepseek.com"></label><label><span data-zh="模型 ID（填写账号可用模型）" data-en="Model ID available in your account"></span><input id="llmModel" maxlength="200" placeholder="Model ID"></label><label>API Key<input id="llmKey" type="password" autocomplete="new-password" placeholder="仅本次服务" data-placeholder-zh="仅本次服务" data-placeholder-en="This service session"></label><div class="actions"><button id="llmSave" type="submit" data-zh="保存设置" data-en="Save settings"></button><button id="llmTest" class="secondary" type="button" data-zh="测试连接" data-en="Test connection"></button></div></form><small data-zh="启用后，聊天文字和任务摘要会发送至所选服务。照片和权重不上传。Key仅存在服务内存，重启后需重新填写或使用环境变量；测试连接会发送一次API请求。" data-en="When enabled, chat text and task summaries go to this provider; photos and weights are not uploaded. Keys stay in service memory; re-enter after restart or use environment variables. Test connection sends one API request."></small></div></details></header><div id="notice" role="status"></div><div id="viewStack" class="view-stack">
<section id="conversation" class="panel chat-panel"><div class="chat-workspace"><div class="chat-scroll"><div id="chatMessages" class="chat-messages" aria-live="polite"></div><div id="chatCard" class="chat-card"></div><div id="savedTaskHistory" class="chat-card" hidden></div><div id="chatAnnotationSlot"></div></div><form id="chatForm" class="chat-composer"><label for="chatInput" class="sr-only" data-zh="给 Agent 发消息" data-en="Message to Agent"></label><textarea id="chatInput" rows="2" placeholder="说说你要完成什么，例如：创建项目 东楼巡检" data-placeholder-zh="说说你要完成什么，例如：创建项目 东楼巡检" data-placeholder-en="Tell me what you want to do, e.g. create project East building" required></textarea><button id="chatSend" data-zh="发送" data-en="Send"></button></form><p class="composer-note" data-zh="通过对话提交数据、准备训练和查看结果；执行前会请你核对。" data-en="Use chat to submit data, prepare training and review results. Actions are reviewed before execution."></p></div></section>
<section id="intake" class="panel" hidden><h2 data-zh="导入已标注照片" data-en="Import annotated photos"></h2><p data-zh="填写本机或服务器上的路径。CSV/XLSX 表格与照片根目录分开指定；缺失标签保持未知。" data-en="Use paths on the machine hosting this service. Specify a CSV/XLSX manifest and photo root separately. Missing labels remain unknown."></p><form id="importForm" class="grid"><label><span data-zh="数据集名称 / 场景" data-en="Dataset name / scene"></span><input name="name" required></label><label><span data-zh="照片根目录" data-en="Photo root"></span><input name="root" required placeholder="/home/test/data/photos"></label><label class="wide"><span data-zh="CSV / XLSX 路径（留空则扫描文件夹并标注）" data-en="CSV / XLSX path (leave blank to scan and annotate folder)"></span><input name="manifest" placeholder="/home/test/data/train.csv"></label><button data-zh="导入表格 / 扫描照片" data-en="Import manifest / scan photos"></button></form>
<details><summary data-zh="表格格式" data-en="Manifest format"></summary><pre>image_id,path,hollow,spalling,crack,scene,group
photo_001,building_a/001.jpg,,0,1,scene_a,building_a</pre><p data-zh="标签 1=阳性，0=确认阴性，空白=未知。group 用于同一建筑/来源的跨角色隔离。不同场景请明确填写 scene；表格不执行公式。" data-en="1=positive, 0=confirmed negative, blank=unknown. group separates buildings/sources across roles. Use distinct scene names. Spreadsheet formulas are rejected."></p></details>
<div id="annotation" hidden><h3 data-zh="图片标注（整次保存计一次提交）" data-en="Photo annotation (one save = one submission)"></h3><div id="photoRows"></div><div class="actions"><button id="prev">←</button><span id="page"></span><button id="next">→</button><button id="saveAnnotation" data-zh="保存为数据集" data-en="Save dataset"></button></div></div><div id="datasets"></div></section>
<section id="configure" class="panel" hidden><h2 data-zh="本轮模型任务" data-en="Model task for this round"></h2><div id="projectParameters"></div><div id="chatOverview" hidden></div><details class="parameter-editor"><summary data-zh="查看或编辑任务配置" data-en="Inspect or edit task configuration"></summary><div id="activeSummary" class="callout"></div><form id="roundForm"><div class="grid"><label><span data-zh="主干" data-en="Backbone"></span><select name="backbone" id="backbone"></select></label><label><span data-zh="种子（单个）" data-en="Seed (single)"></span><input type="number" name="seed" value="20260921" required min="0" max="4294967295"></label><label><span data-zh="本轮训练数据" data-en="New training data"></span><select id="trainData" multiple required></select></label><label><span data-zh="Val（用于选择与阈值）" data-en="Val (selection and calibration)"></span><select id="valData" multiple></select></label><label><span data-zh="独立评价数据（按场景累计）" data-en="Independent evaluation (cumulative by scene)"></span><select id="evalData" multiple></select></label><label><span data-zh="权重来源" data-en="Weight source"></span><input type="hidden" name="initialization" value="cached_imagenet"><span id="initializationSource">ImageNet</span></label></div><fieldset><legend data-zh="按需选择维护工具" data-en="Select maintenance tools as needed"></legend><div id="tools" class="tools"></div></fieldset><details><summary data-zh="参数预设与进阶选项" data-en="Preset and advanced options"></summary><p data-zh="1280 整图 letterbox；BF16训练、FP16评价；有效batch16。维护默认5epoch、38步/epoch、8新+8旧；初始40epoch、Val最佳、早停8。修改参数会留痕，属于工程配置。" data-en="Full1280 letterbox; BF16 training, FP16 evaluation; effective batch16. Update defaults: 5 epochs, 38 steps/epoch, 8 new+8 replay. Initial: 40 epochs, best Val, patience8. Changes are recorded as an engineering configuration."></p><div class="grid" id="advanced"><label>epochs<input name="epochs" type="number" min="1" placeholder="preset"></label><label>steps / epoch (update)<input name="steps_per_epoch" type="number" min="1" placeholder="38"></label><label>micro batch<input name="micro_batch" type="number" min="1" placeholder="8"></label><label>learning rate<input name="lr" type="number" min="0" step="any" placeholder="preset"></label><label>patience (initial)<input name="patience" type="number" min="1" placeholder="8"></label></div><div id="presetDetails"></div></details><button data-zh="保存本轮配置" data-en="Save round configuration"></button></form></details><h3 data-zh="轮次与候选任务" data-en="Rounds and candidate jobs"></h3><div id="rounds"></div><div id="jobs"></div><pre id="jobLog" hidden></pre></section>
<section id="compare" class="panel" hidden><h2 id="resultsHeading"></h2><p id="resultsIntro"></p><div class="grid"><label><span data-zh="决策轮次" data-en="Decision round"></span><select id="decisionRound"></select></label><label><span data-zh="候选" data-en="Candidate"></span><select id="comparisonJob"></select></label></div><div id="comparison"></div><div class="decision"><label><span data-zh="采用 / 保留理由" data-en="Adoption / Hold reason"></span><textarea id="reason" rows="3"></textarea></label><div class="actions"><button id="adopt" data-zh="采用选中候选" data-en="Adopt selected candidate"></button><button id="hold" class="secondary" data-zh="Hold：保留本轮父模型" data-en="Hold: retain round parent"></button></div><p id="decisionHint"></p></div></section>
<section id="audit" class="panel" hidden><h2 data-zh="实际在役版本与审计" data-en="Actual active version and audit"></h2><div id="versions"></div><details><summary data-zh="回滚到曾采用版本（与 Hold 分开）" data-en="Rollback to previously adopted version (separate from Hold)"></summary><form id="rollbackForm"><select id="rollbackVersion" required></select><input id="rollbackReason" name="reason" required placeholder="回滚理由" data-placeholder-zh="回滚理由" data-placeholder-en="Rollback reason"><button data-zh="记录并回滚" data-en="Record and rollback"></button></form></details><div class="actions"><button id="export" data-zh="获取并导出操作记录" data-en="Retrieve and export audit"></button><span id="eventCount"></span></div><details><summary data-zh="显式人工主动计时（默认关闭）" data-en="Explicit human active timer (off by default)"></summary><p data-zh="仅在另行开展操作研究时使用。等待GPU时按 wait；恢复人工工作时按 resume。自动运行时间不计入人工时间。" data-en="Use only when separately conducting an operation study. Press wait during GPU waiting and resume when active human work continues. Automatic runtime is excluded."></p><div class="actions" id="timerControls"><button data-timer="start">start</button><button data-timer="wait">wait</button><button data-timer="resume">resume</button><button data-timer="end">end</button></div><pre id="timerState"></pre></details><div id="events"></div></section>
<section id="settings" class="panel" hidden><h2 data-zh="设置与帮助" data-en="Settings & help"></h2><div class="settings-grid"><div class="settings-card"><h3 data-zh="运行方式" data-en="Runtime"></h3><strong id="settingsMode"></strong><p data-zh="界面通过本地服务运行。训练任务需要在运行 Agent 的主机上启用执行。" data-en="The interface uses a local service. Training execution must be enabled on the Agent host."></p></div><div class="settings-card"><h3 data-zh="数据与项目" data-en="Data & projects"></h3><p data-zh="数据路径指运行 Agent 的电脑。请提交已经划分好的数据；各项目的模型、方法和训练参数在左栏项目下查看。" data-en="Data paths refer to the Agent host. Submit pre-split data; inspect each project's models, methods and parameters from its sidebar entry."></p></div></div><div class="settings-card environment-settings"><h3 data-zh="共享训练环境" data-en="Shared training environment"></h3><p id="environmentSummary"></p><button id="environmentOpen" type="button" data-zh="配置或检查环境" data-en="Set up or check environment"></button></div><h3 data-zh="环境与诊断" data-en="Environment & diagnostics"></h3><p class="environment-note" data-zh="通过上方向导配置共享训练环境。切换环境前请完成当前任务。" data-en="Use the wizard above to configure the shared training environment. Finish current jobs before switching environments."></p><button id="refresh" class="secondary" data-zh="重新读取状态" data-en="Reload state"></button></section></div></main></div><script src="/app.js"></script><script src="/chat.js"></script><script src="/workspace.js"></script><script src="/history.js"></script><script src="/llm.js"></script><div id="environmentMount"></div><script src="/environment.js"></script></body></html>
