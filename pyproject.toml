[project]
name = "building-facade-engineering-agent"
version = "3.0.0"
description = "A chat-driven, human-supervised agent for building-facade model training, adaptation, evaluation, and version management."
requires-python = ">=3.11"
dependencies = []
license = {file = "LICENSE"}

[project.urls]
Repository = "https://github.com/LotusRosa/building-facade-engineering-agent"

[tool.setuptools]
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]

[project.scripts]
facade-next = "facade_next.cli:main"

[tool.setuptools.packages.find]
include = ["facade_next*"]

[tool.setuptools.package-data]
facade_next = ["static/*", "presets.json", "worker_manifest.json"]
